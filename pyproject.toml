[project]
name = "blogger-mcp"
version = "0.1.0"
description = "MCP server for creating and editing Blogger posts and pages via the Blogger API v3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
]

[project.scripts]
blogger-mcp = "blogger_mcp.server:main"
blogger-mcp-auth = "blogger_mcp.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blogger_mcp"]
